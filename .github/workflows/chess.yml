name: Community chess

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-chess
  queue: max

jobs:
  move:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'chess:')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Render the board
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/chess.mjs render --repo "$GITHUB_REPOSITORY" --write
      - name: Validate and play the requested move
        id: move
        if: github.event_name == 'issues'
        run: |
          node scripts/chess.mjs process --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/chess-result.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/chess-result.json`, 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `accepted=${result.accepted === true}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Chess request: ${result.accepted ? 'played' : 'not played'}. ${result.reason || ''}\n`);
          JS
      - name: Install the 3D renderer
        if: github.event_name == 'workflow_dispatch' || steps.move.outputs.accepted == 'true'
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/blender.tar.xz" https://download.blender.org/release/Blender4.0/blender-4.0.2-linux-x64.tar.xz
          printf '%s  %s\n' '5583a5588736da8858c522ef17fff5d73be59c47a6fe91ad29c6f3263e22086a' "$RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "BLENDER_EXECUTABLE=$RUNNER_TEMP/blender-4.0.2-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Render the live position in 3D
        if: github.event_name == 'workflow_dispatch' || steps.move.outputs.accepted == 'true'
        run: node scripts/render-3d.mjs
      - name: Save the position
        run: |
          git add README.md assets/chess-board.png assets/chess-board.stl game/state.json
          if ! git diff --cached --quiet; then
            git config user.name 'Rob Gungor'
            git config user.email 'rob@robgungor.com'
            git commit -m 'Update the community chessboard'
            git push origin HEAD:main
          fi
      - name: Close the move request
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACCEPTED: ${{ steps.move.outputs.accepted }}
        run: |
          reason=not_planned
          if [ "$ACCEPTED" = true ]; then reason=completed; fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" -f state=closed -f state_reason="$reason" --silent
