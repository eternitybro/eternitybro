name: Community chess

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-chess
  queue: max

jobs:
  move:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'chess:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Render the board
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/chess.mjs render --repo "$GITHUB_REPOSITORY" --write
      - name: Validate and play the requested move
        id: move
        if: github.event_name == 'issues'
        run: |
          node scripts/chess.mjs process --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/chess-result.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/chess-result.json`, 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `accepted=${result.accepted === true}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Chess request: ${result.accepted ? 'played' : 'not played'}. ${result.reason || ''}\n`);
          JS
      - name: Save the position
        run: |
          git add README.md assets/chess-board.svg game/state.json
          if ! git diff --cached --quiet; then
            git config user.name 'Billi'
            git config user.email 'billi@robebot.app'
            git commit -m 'Update the community chessboard' -m 'Co-Authored-By: Billi <billi@robebot.app>'
            git push origin HEAD:main
          fi
      - name: Close the move request
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACCEPTED: ${{ steps.move.outputs.accepted }}
        run: |
          reason=not_planned
          if [ "$ACCEPTED" = true ]; then reason=completed; fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" -f state=closed -f state_reason="$reason" --silent
